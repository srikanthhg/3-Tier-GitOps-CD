name: Update ArgoCD Parameters

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (add or delete)"
        required: true
        type: choice
        default: none
        options:
          - add
          - delete
          - none
      application_folder_name:
        description: "Folder containing the ArgoCD application (e.g. apps/testapp)"
        required: true
      chart_name:
        description: "Helm chart name (e.g. frontend-img)"
        required: true
      env_file_name:
        description: "YAML file name (e.g. argocd-app.yaml)"
        required: true
      key:
        description: "Helm parameter name"
        required: true
      value:
        description: "Helm parameter value (only required for add)"
        required: false

jobs:
  update-argo-params:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run parameter update script
        run: |
          if [ "${{ github.event.inputs.action }}" = "add" ]; then
            python3 scripts/update_argo_params.py add \
              "${{ github.event.inputs.application_folder_name }}" \
              "${{ github.event.inputs.chart_name }}" \
              "${{ github.event.inputs.env_file_name }}" \
              "${{ github.event.inputs.key }}" \
              "${{ github.event.inputs.value }}"
          else
            python3 scripts/update_argo_params.py delete \
              "${{ github.event.inputs.application_folder_name }}" \
              "${{ github.event.inputs.chart_name }}" \
              "${{ github.event.inputs.env_file_name }}" \
              "${{ github.event.inputs.key }}"
          fi

      - name: Commit and push changes
        run: |
          cd ${{ github.workspace }}/argocd-manifests
          git config user.email "noreply-bn@hello.com"
          git config user.name "srikanthg"
          GIT_RETRY-0
            until [ "$GIT_RETRY" -ge 10]
            do
              git add -A
              git diff --quiet & git diff --staged --quiet || git commit -m "@${{ github.actor}}
              git config pull.rebase false # merge (the default strategy)
              git push && break # substitute your command here
              GIT_RETRY=$((GIT_RETRY+1))
              RANDOM_WAIT_TIMER=$((1+ $RANDOM % 10))
              sleep $RANDOM_WAIT_TIMER
              git pull
              echo "RETRY COUNT: $GIT_RETRY"
            done

        env:
         GITHUB TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # git config user.name "github-actions[bot]"
          # git config user.email "github-actions[bot]@users.noreply.github.com"
