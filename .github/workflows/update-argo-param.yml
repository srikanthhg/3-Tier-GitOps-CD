name: Update ArgoCD Helm Parameters

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (add or delete)"
        required: true
        type: choice
        options:
          - add
          - delete
      key:
        description: "Parameter name"
        required: true
      value:
        description: "Parameter value (only required for add)"
        required: false

jobs:
  update-argo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run update script
        run: |
          if [ "${{ github.event.inputs.action }}" = "add" ]; then
            python scripts/update_argo_params.py add "${{ github.event.inputs.key }}" "${{ github.event.inputs.value }}"
          else
            python scripts/update_argo_params.py delete "${{ github.event.inputs.key }}"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update ArgoCD param: ${{ github.event.inputs.action }} ${{ github.event.inputs.key }}"
          git push
