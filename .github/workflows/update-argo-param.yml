name: Update ArgoCD Parameters

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (add or delete)"
        required: true
        type: choice
        options:
          - add
          - delete
      application_folder_name:
        description: "Folder containing the ArgoCD application (e.g. apps/testapp)"
        required: true
      chart_name:
        description: "Helm chart name (e.g. frontend-img)"
        required: true
      env_file_name:
        description: "YAML file name (e.g. argocd-app.yaml)"
        required: true
      key:
        description: "Helm parameter name"
        required: true
      value:
        description: "Helm parameter value (only required for add)"
        required: false

jobs:
  update-argo-params:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run parameter update script
        run: |
          if [ "${{ github.event.inputs.action }}" = "add" ]; then
            python3 scripts/update_argo_params.py add \
              "${{ github.event.inputs.application_folder_name }}" \
              "${{ github.event.inputs.chart_name }}" \
              "${{ github.event.inputs.env_file_name }}" \
              "${{ github.event.inputs.key }}" \
              "${{ github.event.inputs.value }}"
          else
            python3 scripts/update_argo_params.py delete \
              "${{ github.event.inputs.application_folder_name }}" \
              "${{ github.event.inputs.chart_name }}" \
              "${{ github.event.inputs.env_file_name }}" \
              "${{ github.event.inputs.key }}"
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "ArgoCD parameter ${{ github.event.inputs.action }}: ${{ github.event.inputs.key }}"
          git push
