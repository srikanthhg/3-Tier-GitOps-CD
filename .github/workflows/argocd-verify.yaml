name: Validate ArgoCD Manifests

on:
  pull_request:
    paths:
      - 'argocd-manifests/**.yaml'
      - 'argocd-manifests/**.yml'
  workflow_dispatch:

jobs:
  validate-argocd:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Install tools
        run: |
          curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          chmod +x /usr/local/bin/kubeconform

      - name: 🔍 Validate YAML syntax
        run: |
          shopt -s nullglob
          yaml_files=(argocd-manifests/**/*.{yaml,yml})
          if [ ${#yaml_files[@]} -eq 0 ]; then
            echo "⚠️ No YAML files found. Skipping."
            exit 0
          fi
          for f in "${yaml_files[@]}"; do
            echo "→ Validating YAML: $f"
            yq eval '.' "$f" >/dev/null || { echo "❌ Invalid YAML in $f"; exit 1; }
          done
          echo "✅ YAML syntax OK."

      - name: 📥 Extract Argo CD CRDs
        run: |
          mkdir -p schemas/crds
          curl -sL https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/crds/application-crd.yaml -o crds.yaml

          # Extract individual CRDs
          yq eval 'select(.kind == "CustomResourceDefinition" and .spec.names.kind == "Application")' crds.yaml > schemas/crds/argoproj.io_applications.yaml
          yq eval 'select(.kind == "CustomResourceDefinition" and .spec.names.kind == "AppProject")' crds.yaml > schemas/crds/argoproj.io_appprojects.yaml

          # Confirm
          if [ ! -s schemas/crds/argoproj.io_applications.yaml ]; then
            echo "❌ Failed to extract Application CRD"
            exit 1
          fi

      - name: 🧠 Validate with kubeconform
        run: |
          kubeconform \
            -summary \
            -strict \
            -output text \
            -schema-location default \
            -schema-location "crd://schemas/crds" \
            argocd-manifests/

          echo "✅ Schema validation passed!"
