name: Validate ArgoCD Manifests

on:
  pull_request:
    paths:
      - 'argocd-manifests/**.yaml'
      - 'argocd-manifests/**.yml'
  workflow_dispatch:

jobs:
  validate-argocd:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Install tools
        run: |
          # Install yq for YAML syntax check
          curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

          # Install kubeconform for schema validation
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: 🔍 Validate YAML syntax
        run: |
          files=$(find argocd-manifests -type f \( -name "*.yaml" -o -name "*.yml" \))
          if [ -z "$files" ]; then
            echo "⚠️ No YAML files found in 'argocd-manifests/'."
            exit 1
          fi

          echo "Found YAML file(s):"
          echo "$files"
          for f in $files; do
            echo "→ Validating syntax: $f"
            yq eval '.' "$f" >/dev/null || { echo "❌ Invalid YAML in $f"; exit 1; }
          done
          echo "✅ YAML syntax is valid."

      - name: 📥 Download official Argo CD CRDs
        run: |
          mkdir -p crds
          # This is the real, official CRD file that includes Application and AppProject
          curl -sL https://github.com/argoproj/argo-cd/raw/stable/manifests/crds/application-crd.yaml -o crds/argocd-crds.yaml

      - name: 🧠 Validate against Kubernetes + Argo CD schemas
        run: |
          kubeconform \
            -summary \
            -strict \
            -output text \
            -schema-location default \
            -schema-location "crd://crds" \
            argocd-manifests/

          echo "✅ All manifests passed schema validation!"
