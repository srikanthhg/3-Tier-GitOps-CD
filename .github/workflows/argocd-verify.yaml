name: Validate Argo CD Manifests

on:
  workflow_dispatch:

jobs:
  validate-argocd-manifests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq curl
          curl -sLo /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          curl -sLo /usr/local/bin/kubeconform https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64
          chmod +x /usr/local/bin/kubeconform

      - name: 🔍 Validate YAML syntax
        run: |
          echo "🔍 Validating YAML syntax in argocd-manifests/..."
          for f in $(find argocd-manifests -type f \( -name "*.yaml" -o -name "*.yml" \)); do
            echo "→ Checking $f"
            yq eval '.' $f > /dev/null 2>&1 || { echo "❌ Invalid YAML syntax in $f"; exit 1; }
          done
          echo "✅ All YAML files are syntactically valid."

      - name: 🧠 Validate Kubernetes + Argo CD schemas
        run: |
          echo "🧠 Validating Kubernetes + Argo CD schemas..."
          mkdir -p schemas
          curl -sL https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/crds/application-crd.yaml -o schemas/application-crd.yaml
          curl -sL https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/crds/appproject-crd.yaml -o schemas/appproject-crd.yaml
          
          kubeconform \
            -summary \
            -strict \
            -output text \
            -schema-location default \
            -schema-location file://schemas \
            argocd-manifests/
          
          echo "✅ All manifests are schema-valid (including Argo CD CRDs)."
