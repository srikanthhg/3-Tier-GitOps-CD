name: Validate ArgoCD Manifests

on:
  pull_request:
    paths:
      - 'argocd-manifests/**.yaml'
      - 'argocd-manifests/**.yml'
  workflow_dispatch:

jobs:
  validate-argocd:
    name: Validate ArgoCD Application Manifests
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Install validation tools
        run: |
          echo "Installing yq (YAML processor)..."
          curl -L "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64" -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

          echo "Installing kubeconform (Kubernetes schema validator)..."
          curl -L "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz" | tar xz
          sudo mv kubeconform /usr/local/bin/
          chmod +x /usr/local/bin/kubeconform

      - name: 🔍 Validate YAML syntax
        run: |
          shopt -s nullglob
          yaml_files=(argocd-manifests/**/*.{yaml,yml})
          if [ ${#yaml_files[@]} -eq 0 ]; then
            echo "⚠️ No YAML files found in 'argocd-manifests/'. Skipping validation."
            exit 0
          fi

          echo "Found ${#yaml_files[@]} YAML file(s) to validate:"
          for f in "${yaml_files[@]}"; do
            echo "  → $f"
            yq eval '.' "$f" >/dev/null || { echo "❌ Invalid YAML syntax in $f"; exit 1; }
          done
          echo "✅ All YAML files are syntactically valid."

      - name: 📥 Download Argo CD CRDs
        run: |
          mkdir -p schemas/crds
          echo "Downloading Argo CD Application CRD..."
          curl -sL https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/crds/application-crd.yaml -o schemas/crds/application-crd.yaml

          echo "Downloading Argo CD AppProject CRD..."
          curl -sL https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/crds/appproject-crd.yaml -o schemas/crds/appproject-crd.yaml

      - name: 🧠 Validate against Kubernetes + Argo CD schemas
        run: |
          kubeconform \
            -summary \
            -strict \
            -output text \
            -schema-location default \
            -schema-location "crd://schemas/crds" \
            argocd-manifests/

          echo "✅ All manifests passed schema validation!"
