name: Validate ArgoCD Manifests

on:
  pull_request:
    paths:
      - 'argocd-manifests/**.yaml'
      - 'argocd-manifests/**.yml'
  workflow_dispatch:

jobs:
  validate-argocd:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Install yq and kubeconform
        run: |
          # Install yq
          curl -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

          # Install kubeconform
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: 🔍 Validate YAML syntax
        run: |
          files=$(find argocd-manifests -type f \( -name "*.yaml" -o -name "*.yml" \))
          if [ -z "$files" ]; then
            echo "⚠️ No YAML files found in 'argocd-manifests/'."
            exit 1
          fi

          echo "Validating YAML files:"
          for f in $files; do
            echo "→ $f"
            yq eval '.' "$f" >/dev/null || { echo "❌ Invalid YAML in $f"; exit 1; }
          done
          echo "✅ YAML syntax is valid."

      - name: 📥 Fetch and extract Argo CD CRDs (for v2.10+)
        run: |
          mkdir -p crds
          # Download the CRD file (which is a 'List' in v2.10+)
          curl -sL https://github.com/argoproj/argo-cd/raw/stable/manifests/crds/application-crd.yaml -o crds.yaml
          # Extract each CRD from the .items array
          yq -N '.items[]' crds.yaml > crds/argocd-crds.yaml

      - name: 🧠 Validate against Kubernetes + Argo CD schemas
        run: |
          kubeconform \
            -summary \
            -strict \
            -output text \
            -schema-location default \
            -schema-location "crd://crds" \
            argocd-manifests/

          echo "✅ All manifests passed validation!"
